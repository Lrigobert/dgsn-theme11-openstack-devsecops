# Inventaire Kolla-Ansible — groupes de nœuds DGSN (Thème 11)
# Les groupes de services (enfants) sont repris du modèle "multinode" fourni par
# kolla-ansible : voir scripts/p2-setup-vm1.sh qui assemble l'inventaire final.
# Ajouter compute2 = décommenter UNE ligne dans [compute].

[control]
controller ansible_host=192.168.100.40

[network]
controller ansible_host=192.168.100.40

[compute]
controller ansible_host=192.168.100.40
#compute2  ansible_host=192.168.100.41

[monitoring]
controller ansible_host=192.168.100.40

[storage]
controller ansible_host=192.168.100.40

[deployment]
# VM1 (Ubuntu 22.04) ne fait que piloter Ansible, aucun conteneur : seule exemption
# au contrôle d'OS hôte de Kolla 2025.1 (noble exigé). controller reste contrôlé.
localhost ansible_connection=local prechecks_enable_host_os_checks=false

[all:vars]
ansible_user=jacques1
ansible_become=true
ansible_python_interpreter=/usr/bin/python3
